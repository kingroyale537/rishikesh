[workspace]
resolver = "2"
members = [
    "crates/rishi_span",
    "crates/rishi_lexer",
    "crates/rishi_ast",
    "crates/rishi_parser",
    "crates/rishi_eval",
    "crates/rishi_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rishikesh Rai"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rishi_span = { path = "crates/rishi_span" }
rishi_lexer = { path = "crates/rishi_lexer" }
rishi_ast = { path = "crates/rishi_ast" }
rishi_parser = { path = "crates/rishi_parser" }
rishi_eval = { path = "crates/rishi_eval" }
colored = "2.1"
rustyline = "14.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
serde_json = "1.0"
num-bigint = "0.4"
num-traits = "0.2"

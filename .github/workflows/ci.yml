name: Rishikesh CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Workspace
        run: cargo build --verbose

      - name: Run Unit Tests
        run: cargo test --verbose

      - name: Install Rishi CLI
        run: cargo install --path crates/rishi_cli

      - name: Verify Language Test Suite
        run: rishi test
